<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%SITE_THEME_COLOR%" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="robots" content="%SITE_ROBOTS%" />
    <meta property="og:title" content="%SITE_NAME%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%SITE_NAME%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>%SITE_NAME%</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": %SITE_NAME_JSON%,
        "description": %SITE_DESCRIPTION_JSON%,
        "inLanguage": "en"
      }
    </script>
    <style>
      body { margin: 0; background: #f6f1e8; color: #1a2c2a; font-family: Georgia, serif; }
      noscript p { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-size: 1.25rem; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p>%SITE_NAME% is a map of adult changing tables. This demo needs JavaScript to run. The list of places is part of the app, so a map-free reading still needs the page to load.</p>
    </noscript>
  </body>
</html>
